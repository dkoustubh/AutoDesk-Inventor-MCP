services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ats-engineering-backend
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      - HOST=0.0.0.0
      - PORT=8005
      - VLLM_API_BASE=http://192.168.11.86:8000/v1
      - VLLM_MODEL=google/gemma-4-31B-it
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@192.168.11.86:5432/ats_engineering
      - REDIS_URL=redis://192.168.11.86:6380/0
      - DEFAULT_WORKSTATION_IP=192.168.11.150
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ats-engineering-frontend
    restart: unless-stopped
    ports:
      - "8085:80"
    depends_on:
      - backend

networks:
  default:
    name: ats-network
